[package]
name = "steezen-core"
version = "0.1.0"
edition = "2024"

[features]
default = []
local = ["dep:whisper-rs"]
cuda = ["local", "whisper-rs/cuda"]
vulkan = ["local", "whisper-rs/vulkan"]

[dependencies]
whisper-rs = { version = "=0.16.0", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
dirs = "=6.0.0"
regex = "=1.13.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
chacha20poly1305 = "=0.11.0"
argon2 = "=0.6.0"
base64 = "=0.22.1"
getrandom = "=0.4.3"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "multipart", "native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "multipart", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
