[package]
name = "whisper-hook"
version = "0.1.0"
edition = "2024"

[features]
default = ["local"]
local = ["dep:whisper-rs"]
cuda = ["local", "whisper-rs/cuda"]
vulkan = ["local", "whisper-rs/vulkan"]

[dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
tray-icon = "=0.24.2"
global-hotkey = "=0.8.0"
cpal = "=0.18.2"
whisper-rs = { version = "=0.16.0", optional = true }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "multipart", "native-tls"] }
arboard = "=3.6.1"
enigo = "=0.6.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
dirs = "=6.0.0"
notify-rust = "=4.18.0"
regex = "=1.13.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
