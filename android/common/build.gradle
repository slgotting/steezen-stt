plugins {
    id 'com.android.library'
}

android {
    namespace = "com.slgotting.steezen.common"
    compileSdk = 36
    ndkVersion = "29.0.14206865"
    defaultConfig {
        minSdk 30
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('cargoBuild', Exec) {
    workingDir new File(rootDir, "..")
    environment "ANDROID_NDK_HOME", android.ndkDirectory.absolutePath
    commandLine 'nice', '-n', '19', 'cargo', 'ndk', '-t', 'arm64-v8a', '-t', 'x86_64', '-P', '30', '-o', 'android/common/src/main/jniLibs', 'build', '--release', '-p', 'steezen-mobile'
}
preBuild.dependsOn cargoBuild
