plugins {
    id 'com.android.application'
}

def coreVersion = new File(rootDir, "../Cargo.toml").readLines().find { it.startsWith("version = ") }.split('"')[1]

android {
    namespace = "com.slgotting.steezenstt"
    compileSdk = 36
    ndkVersion = "29.0.14206865"
    defaultConfig {
        applicationId "com.slgotting.steezenstt"
        minSdk 30
        targetSdk 36
        versionCode coreVersion.split("\\.").inject(0) { acc, p -> acc * 1000 + p.toInteger() }
        versionName coreVersion
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('cargoBuild', Exec) {
    workingDir new File(rootDir, "..")
    environment "ANDROID_NDK_HOME", android.ndkDirectory.absolutePath
    commandLine 'nice', '-n', '19', 'cargo', 'ndk', '-t', 'arm64-v8a', '-t', 'x86_64', '-P', '30', '-o', 'android/app/src/main/jniLibs', 'build', '--release', '-p', 'steezen-mobile'
}
preBuild.dependsOn cargoBuild
