plugins {
    id 'com.android.application'
}

def coreVersion = new File(rootDir, "../Cargo.toml").readLines().find { it.startsWith("version = ") }.split('"')[1]

android {
    namespace = "com.slgotting.steezenstt"
    compileSdk = 36
    defaultConfig {
        applicationId "com.slgotting.steezenstt"
        minSdk 30
        targetSdk 36
        versionCode versionCodeOf(coreVersion)
        versionName coreVersion
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':common')
}
