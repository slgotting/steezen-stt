[package]
name = "steezen-mobile"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
steezen-core = { path = "../../core", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "multipart"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
